<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Solisys - Design, secure and automate your Microsoft cloud" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071528"/>
      <stop offset="0.55" stop-color="#0B3563"/>
      <stop offset="1" stop-color="#0063B1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#50B4FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#50B4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>

  <!-- Cloud network on the right -->
  <g stroke="#7FC8FF" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M880 90 L980 60 L1090 105 L1180 70"/>
    <path d="M880 90 L940 170 L1050 190 L1090 105"/>
    <path d="M940 170 L900 250 L1010 270 L1050 190 L1160 215 L1180 70"/>
    <path d="M1010 270 L1160 215"/>
    <path d="M980 60 L1050 190"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="880" cy="90" r="5" fill-opacity="0.9"/>
    <circle cx="980" cy="60" r="4" fill-opacity="0.7"/>
    <circle cx="1090" cy="105" r="7" fill="#50E6FF"/>
    <circle cx="1180" cy="70" r="4" fill-opacity="0.7"/>
    <circle cx="940" cy="170" r="4" fill-opacity="0.7"/>
    <circle cx="1050" cy="190" r="8" fill="#50E6FF"/>
    <circle cx="900" cy="250" r="4" fill-opacity="0.6"/>
    <circle cx="1010" cy="270" r="5" fill-opacity="0.8"/>
    <circle cx="1160" cy="215" r="5" fill-opacity="0.8"/>
  </g>
  <circle cx="1050" cy="190" r="18" fill="none" stroke="#50E6FF" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1090" cy="105" r="16" fill="none" stroke="#50E6FF" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Text -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="72" y="74" fill="#7FC8FF" font-size="15" font-weight="600" letter-spacing="4">SOLISYS-CLOUD ON GITHUB</text>
    <rect x="72" y="88" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="160" fill="#FFFFFF" font-size="72" font-weight="700">Solisys</text>
    <text x="72" y="202" fill="#FFFFFF" fill-opacity="0.92" font-size="26" font-weight="400">Design, secure and automate your Microsoft cloud.</text>
    <text x="72" y="234" fill="#A9D4FF" font-size="17" font-weight="400">Hands-on labs, reusable modules and field-tested material.</text>
  </g>

  <!-- Theme chips -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">
    <g transform="translate(72,262)">
      <rect width="72" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FC8FF" stroke-opacity="0.6"/>
      <text x="36" y="20" text-anchor="middle">Azure</text>
    </g>
    <g transform="translate(154,262)">
      <rect width="132" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FC8FF" stroke-opacity="0.6"/>
      <text x="66" y="20" text-anchor="middle">Microsoft 365</text>
    </g>
    <g transform="translate(296,262)">
      <rect width="86" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FC8FF" stroke-opacity="0.6"/>
      <text x="43" y="20" text-anchor="middle">Entra ID</text>
    </g>
    <g transform="translate(392,262)">
      <rect width="84" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FC8FF" stroke-opacity="0.6"/>
      <text x="42" y="20" text-anchor="middle">DevOps</text>
    </g>
    <g transform="translate(486,262)">
      <rect width="124" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FC8FF" stroke-opacity="0.6"/>
      <text x="62" y="20" text-anchor="middle">Cybersecurity</text>
    </g>
    <g transform="translate(620,262)">
      <rect width="48" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FC8FF" stroke-opacity="0.6"/>
      <text x="24" y="20" text-anchor="middle">AI</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
